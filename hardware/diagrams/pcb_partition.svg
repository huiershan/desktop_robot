<text x="90" y="880" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J1  受保护的5V电源输入</text>
<text x="90" y="909" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J2  左电机输出（AO1 / AO2）</text>
<text x="90" y="938" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J3  右电机输出（BO1 / BO2）</text>
<text x="90" y="967" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J4A/J4B  NodeMCU两列插座（待定位）</text>
<text x="90" y="996" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J5  OLED显示屏（I²C）</text>
<text x="90" y="1025" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J6  GY-521 / MPU6050六轴传感器</text>
<text x="505" y="880" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J7  DHT11温湿度传感器</text>
<text x="505" y="909" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J8  左下视红外候选接口（待确认）</text>
<text x="505" y="938" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J9  右下视红外候选接口（待确认）</text>
<text x="505" y="967" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J10  3.3V调试串口（待定位）</text>
<text x="505" y="996" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J11  指示LED1：GPIO13，经1kΩ限流</text>
<text x="505" y="1025" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J12  指示LED2：GPIO16，经1kΩ限流</text>
<text x="920" y="880" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J13  BH1750光照度传感器（I²C）</text>
<text x="920" y="909" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J14  ASR02语音板：电源与UART串口</text>
<text x="920" y="938" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J15  GY-530激光测距（I²C / XSHUT）</text>
<text x="920" y="967" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J16  主电源开关引出（待定位）</text>
<text x="920" y="996" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">J17  电机允许开关引出（待定位）</text>
<text x="70" y="1090" font-size="13" fill="#52687b" font-weight="400" text-anchor="start">J4A/J4B、J10、J16、J17 尚未确定板上坐标，仅在速查表说明用途；其他标记仍是候选参考点。</text>
