<text x="950" y="195" font-size="20" fill="#17324d" font-weight="700" text-anchor="start">布局约束</text>
<text x="950" y="234" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">1. 成品开发板可拆卸，天线靠前缘。</text>
<text x="950" y="266" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">2. 射频区避免铜、走线、螺丝和电池。</text>
<text x="950" y="298" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">3. MPU 平整固定并记录机器人轴向。</text>
<text x="950" y="330" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">4. 入口保护与驱动靠近后方功率出口。</text>
<text x="950" y="362" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">5. DHT、光照、OLED、ToF 由线束外置。</text>
<text x="950" y="394" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">6. ASR 整板位于上层，串口经 U2。</text>
<rect x="940" y="450" width="410" height="192" rx="4" fill="white" stroke="#b8c8d8" stroke-width="1.5"/>
<text x="960" y="478" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">两路普通单颗 LED</text>
<text x="960" y="508" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">GPIO13 → 1kΩ → J11 → LED1</text>
<text x="960" y="538" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">GPIO16 → 1kΩ → J12 → LED2</text>
<text x="960" y="568" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">两路独立；阴极均接 GND</text>
<text x="960" y="598" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">未分配至启动绑带或电机停止信号</text>
<text x="80" y="766" font-size="14" fill="#b86c16" font-weight="400" text-anchor="start">孔与连接器仍为候选：必须使用真实封装复核螺丝头、锁扣、插头与 Z 向空间。</text>
