<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="920" viewBox="0 0 1250 920">
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<rect width="1250" height="920" fill="#f5f8fc"/>
<text x="40" y="48" font-size="26" fill="#17324d" font-weight="700" text-anchor="start">底盘、传感器与前面板布局规划</text>
<text x="40" y="77" font-size="14" fill="#52687b" font-weight="400" text-anchor="start">concept-0.2 · 俯视 / 前视 · 已核对尺寸与规划空间分别标注</text>
<rect x="40" y="96" width="1170" height="36" rx="6" fill="#fff0d9" stroke="#e4c394" stroke-width="1.5"/>
<text x="55" y="120" font-size="15" fill="#b86c16" font-weight="600" text-anchor="start">概念规划 / NOT FOR FABRICATION — 封装、孔位与电源资格尚未闭环</text>
<text x="320" y="180" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">俯视：底盘候选 120 × 160</text>
<rect x="140" y="215" width="360" height="480" rx="10" fill="white" stroke="#17324d" stroke-width="1.5"/>
<rect x="86" y="525.5" width="54" height="129" rx="8" fill="#586778" stroke="#17324d" stroke-width="1.5"/>
<rect x="500" y="525.5" width="54" height="129" rx="8" fill="#586778" stroke="#17324d" stroke-width="1.5"/>
<polyline points="140,590 500,590" fill="none" stroke="#52687b" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 5"/>
<rect x="140" y="572" width="90" height="36" rx="4" fill="#ffe8cf" stroke="#b86c16" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="410" y="572" width="90" height="36" rx="4" fill="#ffe8cf" stroke="#b86c16" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="155" y="401" width="330" height="240" rx="4" fill="#e7effb" stroke="#236bb2" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="167" y="429" font-size="14" fill="#17324d" font-weight="600" text-anchor="start">主 PCB 110 × 80 / 电子层</text>
<rect x="245" y="470" width="150" height="210" rx="4" fill="#eee3f4" stroke="#8865a1" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="253" y="499" font-size="12" fill="#17324d" font-weight="400" text-anchor="start">电池预留</text>
<text x="253" y="524" font-size="12" fill="#17324d" font-weight="400" text-anchor="start">50 × 70</text>
<text x="253" y="549" font-size="12" fill="#17324d" font-weight="400" text-anchor="start">不是实物尺寸</text>
<text x="253" y="574" font-size="12" fill="#17324d" font-weight="400" text-anchor="start">底层两电机之间</text>
<text x="565" y="590" font-size="12" fill="#52687b" font-weight="400" text-anchor="start">轮轴 Y=125</text>
<circle cx="320" cy="290" r="75" fill="#f1f4f7" stroke="#52687b" stroke-width="1.5"/>
<circle cx="320" cy="290" r="24" fill="#d9e0e8" stroke="#52687b" stroke-width="1.5"/>
<text x="320" y="254" font-size="12" fill="#17324d" font-weight="400" text-anchor="middle">钢珠轮：底板避让区50</text>
<text x="320" y="343" font-size="11" fill="#17324d" font-weight="400" text-anchor="middle">高21 / 孔距40 / 孔径4</text>
<rect x="171" y="231" width="28" height="16" rx="4" fill="#dcefd8" stroke="#5d8d46" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="441" y="231" width="28" height="16" rx="4" fill="#dcefd8" stroke="#5d8d46" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="320" y="206" font-size="12" fill="#52687b" font-weight="400" text-anchor="middle">前向 ↑ / 下视红外待选</text>
<text x="85" y="760" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">43 mm 轮径 / 18 mm 轮宽：商家标注。</text>
<text x="85" y="788" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">电机、线束和电池在不同层，需实物检查三维干涉。</text>
<text x="85" y="816" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">钢珠轮垫高量 = 21.5 + 轴心低于底板的距离 − 21。</text>
<text x="920" y="180" font-size="18" fill="#17324d" font-weight="600" text-anchor="middle">前视：显示与感知开口候选</text>
<rect x="740" y="220" width="360" height="300" rx="4" fill="white" stroke="#17324d" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="882.5" y="269.5" width="75" height="81" rx="4" fill="#dbeafe" stroke="#236bb2" stroke-width="1.5"/>
<text x="920.0" y="312.5" font-size="12" fill="#17324d" font-weight="400" text-anchor="middle">OLED</text>
<circle cx="890" cy="344.5" r="4.5" fill="white" stroke="#236bb2" stroke-width="1.5"/>
<circle cx="890" cy="275.5" r="4.5" fill="white" stroke="#236bb2" stroke-width="1.5"/>
<circle cx="950" cy="344.5" r="4.5" fill="white" stroke="#236bb2" stroke-width="1.5"/>
<circle cx="950" cy="275.5" r="4.5" fill="white" stroke="#236bb2" stroke-width="1.5"/>
<text x="920" y="250" font-size="12" fill="#17324d" font-weight="400" text-anchor="middle">25 × 27 / 孔距20 × 23 / Ø3</text>
<rect x="860" y="370" width="120" height="60" rx="4" fill="#fff0d9" stroke="#b86c16" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="920.0" y="393" font-size="12" fill="#17324d" font-weight="400" text-anchor="middle">ToF 预留40 × 20</text>
<text x="920.0" y="414" font-size="11" fill="#17324d" font-weight="400" text-anchor="middle">实际孔位待复核</text>
<circle cx="830" cy="310" r="7" fill="#f4bf62" stroke="#b86c16" stroke-width="1.5"/>
<circle cx="1010" cy="310" r="7" fill="#f4bf62" stroke="#b86c16" stroke-width="1.5"/>
<text x="920" y="548" font-size="13" fill="#17324d" font-weight="400" text-anchor="middle">两颗普通指示 LED，分别接 J11 / J12</text>
<rect x="700" y="590" width="500" height="230" rx="4" fill="white" stroke="#b8c8d8" stroke-width="1.5"/>
<text x="720" y="622" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">外置模块位置原则</text>
<text x="720" y="653" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">DHT：左前通风，避开稳压、驱动和热源。</text>
<text x="720" y="684" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">BH1750：顶部采光，避开 OLED / LED 自照。</text>
<text x="720" y="715" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">ASR02：上层预留40 × 50，整板 / 喇叭待量。</text>
<text x="720" y="746" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">主控天线投影下不放电池、金属及扬声器磁体。</text>
<text x="720" y="777" font-size="14" fill="#17324d" font-weight="400" text-anchor="start">OLED 视窗偏移与透镜中心未测，禁止直接加工。</text>
<text x="60" y="875" font-size="14" fill="#b86c16" font-weight="400" text-anchor="start">主 PCB、底盘、层高与模块预留区都是候选设计；不是加工尺寸图，也没有定义装配公差。</text>
</svg>
